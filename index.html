<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUKOON PLAYER ✨</title>
    <meta name="apple-mobile-web-app-title" content="Sukoon Player">
    <meta name="application-name" content="Sukoon Player">
    <style>
        :root {
            --bg-color: #ffd1dc;
            --surface: rgba(255, 255, 255, 0.7);
            --surface-hover: rgba(255, 255, 255, 0.9);
            --primary: #ff477e;
            --primary-glow: rgba(255, 71, 126, 0.4);
            --text-main: #2b2b2b;
            --text-muted: #6b6b6b;
            --border-radius: 24px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .full-screen-artwork {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        #artwork {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity var(--transition);
        }

        .artwork-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,209,220,0.3) 0%, rgba(255,209,220,0.85) 100%);
            z-index: 1;
        }

        header {
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        .header-title h1 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .header-title p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* CATEGORY CHIPS SCROLLER */
        .category-bar {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            overflow-x: auto;
            white-space: nowrap;
            z-index: 10;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            scrollbar-width: none;
        }
        .category-bar::-webkit-scrollbar { display: none; }

        .chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 71, 126, 0.2);
            background: rgba(255, 255, 255, 0.65);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-main);
        }

        .chip:hover, .chip.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            z-index: 2;
            transition: var(--transition);
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 30px 20px;
        }

        .glass-player-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px 35px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 620px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .track-info {
            margin-bottom: 20px;
        }

        #track-title {
            font-size: 1.6rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #track-artist {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .time-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            width: 45px;
        }

        .slider {
            -webkit-appearance: none;
            flex: 1;
            height: 6px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .main-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 18px;
        }

        .btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            opacity: 0.65;
        }

        .btn:hover { opacity: 1; transform: scale(1.1); }

        .btn-play {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            font-size: 1.6rem;
            opacity: 1;
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .secondary-controls {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.03);
            padding: 8px 16px;
            border-radius: 18px;
        }

        .volume-slider { width: 85px; }

        .btn-playlist-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.05);
            border: none;
            padding: 7px 14px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-playlist-toggle.active {
            background: var(--primary);
            color: white;
        }

        .right-panel {
            width: 0px;
            opacity: 0;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255, 255, 255, 0.5);
            transition: var(--transition);
            overflow: hidden;
        }

        .container.show-playlist .right-panel {
            width: 380px;
            opacity: 1;
        }

        .queue-header {
            padding: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            width: 380px;
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.7);
            outline: none;
            font-size: 0.85rem;
        }

        .search-box:focus {
            background: #fff;
            border-color: var(--primary);
        }

        .queue-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            width: 380px;
        }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .queue-item:hover { background: var(--surface-hover); }
        .queue-item.active {
            background: rgba(255, 71, 126, 0.12);
            border-left: 3px solid var(--primary);
        }

        .queue-thumb {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background: #ffd1dc;
        }

        .queue-details { flex: 1; overflow: hidden; }
        .queue-title {
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .queue-artist {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 900px) {
            .container { flex-direction: column; overflow-y: auto; }
            .left-panel { padding: 15px; justify-content: center; }
            .glass-player-card { padding: 22px 18px; }
            .container.show-playlist .right-panel {
                width: 100%;
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.5);
                opacity: 1;
            }
            .queue-header, .queue-list { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="full-screen-artwork">
        <img id="artwork" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Artwork" />
        <div class="artwork-overlay"></div>
        <audio id="audio-engine"></audio>
    </div>

    <header>
        <div class="header-title">
            <h1>SUKOON PLAYER ✨</h1>
            <p id="greeting-indicator">Sukoon Music</p>
        </div>
    </header>

    <div class="category-bar" id="category-bar">
        <button class="chip active" onclick="loadFeed()">Auto Mood</button>
        <button class="chip" onclick="loadCategory('bhakti')">Bhakti</button>
        <button class="chip" onclick="loadCategory('sad')">Sad</button>
        <button class="chip" onclick="loadCategory('romantic')">Romantic</button>
        <button class="chip" onclick="loadCategory('90s')">90s Hits</button>
        <button class="chip" onclick="loadCategory('old')">Old Classics</button>
        <button class="chip" onclick="loadCategory('qawwali')">Qawwali</button>
        <button class="chip" onclick="loadCategory('bhojpuri')">Bhojpuri</button>
        <button class="chip" onclick="loadCategory('gym')">Gym Workout</button>
        <button class="chip" onclick="loadCategory('funk')">Phonk</button>
        <button class="chip" onclick="loadCategory('english')">English</button>
    </div>

    <div class="container" id="main-container">
        <div class="left-panel">
            <div class="glass-player-card">
                <div class="track-info">
                    <h2 id="track-title">Sukoon Player ✨</h2>
                    <h3 id="track-artist">Select a song to start</h3>
                </div>

                <div class="progress-container">
                    <span class="time-text" id="time-current">0:00</span>
                    <input type="range" class="slider" id="seek-slider" value="0" min="0" max="100">
                    <span class="time-text" id="time-total">0:00</span>
                </div>

                <div class="main-controls">
                    <button class="btn" id="btn-prev">⏮</button>
                    <button class="btn btn-play" id="btn-play-pause">▶</button>
                    <button class="btn" id="btn-next">⏭</button>
                </div>

                <div class="secondary-controls">
                    <button class="btn" id="btn-mute">🔊</button>
                    <input type="range" class="slider volume-slider" id="volume-slider" value="100" min="0" max="100">
                    <button class="btn-playlist-toggle" id="btn-toggle-playlist">📋 Playlist</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="queue-header">
                <input type="text" id="search" class="search-box" placeholder="Search any song (hit Enter)...">
            </div>
            <div class="queue-list" id="queue-list"></div>
        </div>
    </div>

    <script>
        // RENDER DEPLOY HONE KE BAAD APNA RENDER URL YAHAN DALEIN:
        const BACKEND_URL = "https://YOUR-RENDER-APP-NAME.onrender.com";

        const audio = document.getElementById('audio-engine');
        let currentQueue = [];
        let currentIndex = 0;
        let isSeeking = false;

        const DOM = {
            container: document.getElementById('main-container'),
            title: document.getElementById('track-title'),
            artist: document.getElementById('track-artist'),
            artwork: document.getElementById('artwork'),
            playPause: document.getElementById('btn-play-pause'),
            prev: document.getElementById('btn-prev'),
            next: document.getElementById('btn-next'),
            seekSlider: document.getElementById('seek-slider'),
            volumeSlider: document.getElementById('volume-slider'),
            timeCurrent: document.getElementById('time-current'),
            timeTotal: document.getElementById('time-total'),
            queueList: document.getElementById('queue-list'),
            search: document.getElementById('search'),
            btnTogglePlaylist: document.getElementById('btn-toggle-playlist'),
            greeting: document.getElementById('greeting-indicator')
        };

        DOM.btnTogglePlaylist.addEventListener('click', () => {
            DOM.container.classList.toggle('show-playlist');
            DOM.btnTogglePlaylist.classList.toggle('active');
        });

        DOM.playPause.addEventListener('click', () => {
            if (audio.paused) {
                if (audio.src) audio.play();
                else if (currentQueue.length > 0) playTrack(0);
            } else {
                audio.pause();
            }
        });

        audio.addEventListener('play', () => DOM.playPause.innerHTML = '⏸');
        audio.addEventListener('pause', () => DOM.playPause.innerHTML = '▶');
        audio.addEventListener('ended', () => playTrack(currentIndex + 1));

        audio.addEventListener('timeupdate', () => {
            if (!isSeeking && audio.duration) {
                DOM.seekSlider.value = (audio.currentTime / audio.duration) * 100;
                DOM.timeCurrent.textContent = formatTime(audio.currentTime);
                DOM.timeTotal.textContent = formatTime(audio.duration);
            }
        });

        DOM.seekSlider.addEventListener('mousedown', () => isSeeking = true);
        DOM.seekSlider.addEventListener('touchstart', () => isSeeking = true, {passive: true});
        DOM.seekSlider.addEventListener('change', (e) => {
            if (audio.duration) {
                audio.currentTime = (e.target.value / 100) * audio.duration;
            }
            isSeeking = false;
        });

        DOM.volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value / 100;
        });

        DOM.next.addEventListener('click', () => {
            if (currentIndex + 1 < currentQueue.length) playTrack(currentIndex + 1);
        });

        DOM.prev.addEventListener('click', () => {
            if (currentIndex - 1 >= 0) playTrack(currentIndex - 1);
        });

        DOM.search.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                searchTracks(e.target.value.trim());
            }
        });

        async function loadFeed() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/feed`);
                const data = await res.json();
                DOM.greeting.textContent = data.greeting;
                currentQueue = data.tracks;
                renderQueue();
            } catch (err) {
                console.error("Backend offline ya connect nahi hua.");
            }
        }

        async function loadCategory(cat) {
            try {
                const res = await fetch(`${BACKEND_URL}/api/category?genre=${cat}`);
                const data = await res.json();
                currentQueue = data.tracks;
                renderQueue();
            } catch (err) {
                console.error(err);
            }
        }

        async function searchTracks(query) {
            try {
                const res = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                currentQueue = data.tracks;
                renderQueue();
            } catch (err) {
                console.error(err);
            }
        }

        async function playTrack(index) {
            if (!currentQueue[index]) return;
            currentIndex = index;
            const track = currentQueue[index];

            DOM.title.textContent = track.title;
            DOM.artist.textContent = track.artist;
            DOM.artwork.src = track.thumbnail;

            updateQueueHighlight();

            try {
                const res = await fetch(`${BACKEND_URL}/api/stream?id=${track.id}`);
                const data = await res.json();
                audio.src = data.stream_url;
                audio.play();

                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: track.title,
                        artist: track.artist,
                        artwork: [{ src: track.thumbnail, sizes: '512x512', type: 'image/jpeg' }]
                    });
                    navigator.mediaSession.setActionHandler('play', () => audio.play());
                    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                    navigator.mediaSession.setActionHandler('nexttrack', () => playTrack(currentIndex + 1));
                    navigator.mediaSession.setActionHandler('previoustrack', () => playTrack(currentIndex - 1));
                }
            } catch (err) {
                console.error("Stream fetch failed", err);
            }
        }

        function renderQueue() {
            DOM.queueList.innerHTML = '';
            currentQueue.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = `queue-item ${i === currentIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <img class="queue-thumb" src="${t.thumbnail}">
                    <div class="queue-details">
                        <div class="queue-title">${t.title}</div>
                        <div class="queue-artist">${t.artist}</div>
                    </div>
                `;
                item.addEventListener('click', () => playTrack(i));
                DOM.queueList.appendChild(item);
            });
        }

        function updateQueueHighlight() {
            const items = DOM.queueList.querySelectorAll('.queue-item');
            items.forEach((it, idx) => {
                it.classList.toggle('active', idx === currentIndex);
            });
        }

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' + s : s}`;
        }

        // On Load init
        loadFeed();
    </script>
</body>
</html>
