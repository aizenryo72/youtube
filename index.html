<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUKOON PLAYER ✨</title>
    <meta name="apple-mobile-web-app-title" content="Sukoon Player">
    <meta name="application-name" content="Sukoon Player">
    <style>
        :root {
            --bg-color: #ffd1dc;
            --surface: rgba(255, 255, 255, 0.7);
            --primary: #ff477e;
            --primary-glow: rgba(255, 71, 126, 0.4);
            --text-main: #2b2b2b;
            --text-muted: #6b6b6b;
            --transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column;
            height: 100vh; overflow: hidden; position: relative; transition: background-color var(--transition), color var(--transition);
        }

        /* INITIAL FULL SCREEN LOADER */
        .global-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s; color: var(--text-main);
        }
        .global-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .global-loader .spinner { width: 60px; height: 60px; border: 5px solid rgba(128,128,128,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        .global-loader h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
        .global-loader p { font-size: 1rem; color: var(--text-muted); font-weight: 500; text-align: center; padding: 0 20px; }

        .full-screen-artwork { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        #artwork { width: 100%; height: 100%; object-fit: cover; transition: opacity var(--transition); }
        .artwork-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 0%, var(--bg-color) 100%); opacity: 0.9; z-index: 1; transition: background var(--transition); }
        
        #yt-player-iframe { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; z-index: -1; border: none; }

        header { padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; background: var(--surface); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.2); z-index: 10; transition: background var(--transition); }
        .header-title h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
        .header-title p { font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-top: 2px; }

        .category-bar { display: flex; gap: 8px; padding: 10px 20px; overflow-x: auto; white-space: nowrap; z-index: 10; background: rgba(0, 0, 0, 0.05); backdrop-filter: blur(10px); scrollbar-width: none; }
        .category-bar::-webkit-scrollbar { display: none; }
        .chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--primary-glow); background: var(--surface); font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: var(--transition); color: var(--text-main); }
        .chip:hover, .chip.active { background: var(--primary); color: white !important; box-shadow: 0 4px 12px var(--primary-glow); border-color: var(--primary); }

        .container { display: flex; flex: 1; overflow: hidden; z-index: 2; transition: var(--transition); }
        .left-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 30px 20px; }
        .glass-player-card { background: var(--surface); backdrop-filter: blur(25px); padding: 30px 35px; border-radius: 28px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); width: 100%; max-width: 620px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); transition: background var(--transition); }

        .track-info { margin-bottom: 20px; }
        #track-title { font-size: 1.6rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        #track-artist { font-size: 0.95rem; color: var(--text-muted); margin-top: 4px; }

        .progress-container { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .time-text { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; width: 45px; }
        .slider { -webkit-appearance: none; flex: 1; height: 6px; background: rgba(128, 128, 128, 0.3); border-radius: 4px; outline: none; cursor: pointer; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 0 10px var(--primary-glow); }

        .main-controls { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 18px; }
        .btn { background: none; border: none; color: var(--text-main); cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; transition: var(--transition); opacity: 0.8; }
        .btn:hover { opacity: 1; transform: scale(1.1); color: var(--primary); }
        .btn-play { width: 65px; height: 65px; border-radius: 50%; background: var(--primary); color: white !important; font-size: 1.6rem; opacity: 1; box-shadow: 0 6px 20px var(--primary-glow); }

        .secondary-controls { display: inline-flex; align-items: center; gap: 15px; background: rgba(128,128,128,0.1); padding: 8px 16px; border-radius: 18px; }
        .volume-slider { width: 85px; }
        .btn-playlist-toggle { display: flex; align-items: center; gap: 6px; background: rgba(128,128,128,0.1); border: none; padding: 7px 14px; border-radius: 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: var(--transition); color: var(--text-main); }
        .btn-playlist-toggle.active { background: var(--primary); color: white; }

        .right-panel { width: 0px; opacity: 0; background: var(--surface); backdrop-filter: blur(25px); display: flex; flex-direction: column; border-left: 1px solid rgba(255, 255, 255, 0.1); transition: var(--transition); overflow: hidden; }
        .container.show-playlist .right-panel { width: 380px; opacity: 1; }
        .queue-header { padding: 16px; border-bottom: 1px solid rgba(128,128,128,0.1); width: 380px; }
        
        .search-container { display: flex; gap: 10px; width: 100%; }
        .search-box { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(128,128,128,0.2); background: var(--bg-color); color: var(--text-main); outline: none; font-size: 0.85rem; }
        .btn-search { background: var(--primary); color: white; border: none; border-radius: 10px; padding: 0 15px; cursor: pointer; font-size: 1.1rem; transition: transform 0.2s; box-shadow: 0 4px 10px var(--primary-glow); }
        .btn-search:hover { transform: scale(1.05); }

        .queue-list { flex: 1; overflow-y: auto; padding: 10px; width: 380px; position: relative; }
        .queue-item { display: flex; align-items: center; gap: 12px; padding: 9px; border-radius: 10px; cursor: pointer; transition: var(--transition); }
        .queue-item:hover { background: rgba(128,128,128,0.1); }
        .queue-item.active { background: var(--primary-glow); border-left: 3px solid var(--primary); }
        .queue-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
        .queue-details { flex: 1; overflow: hidden; }
        .queue-title { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .queue-artist { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100px; width: 100%; margin-top: 50px; }
        .loader-text { margin-top: 10px; font-weight: 600; color: var(--primary); font-size: 0.9rem; text-align: center;}
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            .container { flex-direction: column; overflow-y: auto; }
            .left-panel { padding: 15px; justify-content: center; }
            .glass-player-card { padding: 22px 18px; }
            .container.show-playlist .right-panel { width: 100%; border-left: none; border-top: 1px solid rgba(128,128,128,0.2); opacity: 1; }
            .queue-header, .queue-list { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- INITIAL FULL SCREEN STARTUP LOADER -->
    <div id="global-loader" class="global-loader">
        <div class="spinner"></div>
        <h2>Sukoon Player ✨</h2>
        <p id="global-loader-text">Preparing your vibe...<br><span style="font-size:0.8rem; font-weight:normal;">wait a second</span></p>
    </div>

    <div class="full-screen-artwork">
        <img id="artwork" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Artwork" />
        <div class="artwork-overlay"></div>
        <div id="yt-player-iframe"></div>
    </div>

    <header>
        <div class="header-title">
            <h1>SUKOON PLAYER ✨</h1>
            <p id="greeting-indicator">Sukoon Music</p>
        </div>
    </header>

    <div class="category-bar" id="category-bar">
        <button id="btn-auto" class="chip active" onclick="loadFeed('btn-auto', true)">Auto Mood</button>
        <button id="btn-podcast" class="chip" onclick="loadCategory('podcast', 'Podcasts 🎙', 'btn-podcast', true)">Podcast</button>
        <button id="btn-bhakti" class="chip" onclick="loadCategory('bhakti', 'Bhakti & Aarti 🕉️', 'btn-bhakti', true)">Bhakti</button>
        <button id="btn-sad" class="chip" onclick="loadCategory('sad', 'Sad & Heartbroken 💔', 'btn-sad', true)">Sad</button>
        <button id="btn-romantic" class="chip" onclick="loadCategory('romantic', 'Romantic Vibes 💕', 'btn-romantic', true)">Romantic</button>
        <button id="btn-gym" class="chip" onclick="loadCategory('gym', 'Ghost Workout 👻', 'btn-gym', true)">Gym Workout</button>
        <button id="btn-bhojpuri" class="chip" onclick="loadCategory('bhojpuri', 'Bhojpuri Hits 🕺', 'btn-bhojpuri', true)">Bhojpuri</button>
        <button id="btn-qawwali" class="chip" onclick="loadCategory('qawwali', 'Sufi & Qawwali 🌙', 'btn-qawwali', true)">Qawwali</button>
        <button id="btn-funk" class="chip" onclick="loadCategory('funk', 'Phonk & Bass 🔥', 'btn-funk', true)">Phonk</button>
        <button id="btn-90s" class="chip" onclick="loadCategory('90s', '90s Evergreen 📼', 'btn-90s', true)">90s Hits</button>
        <button id="btn-old" class="chip" onclick="loadCategory('old', 'Retro Classics 📻', 'btn-old', true)">Old Classics</button>
        <button id="btn-english" class="chip" onclick="loadCategory('english', 'Global Pop 🌍', 'btn-english', true)">English</button>
    </div>

    <div class="container" id="main-container">
        <div class="left-panel">
            <div class="glass-player-card">
                <div class="track-info">
                    <h2 id="track-title">Sukoon Player ✨</h2>
                    <h3 id="track-artist">Select a song to play</h3>
                </div>

                <div class="progress-container">
                    <span class="time-text" id="time-current">0:00</span>
                    <input type="range" class="slider" id="seek-slider" value="0" min="0" max="100">
                    <span class="time-text" id="time-total">0:00</span>
                </div>

                <div class="main-controls">
                    <button class="btn" id="btn-prev">⏮</button>
                    <button class="btn btn-play" id="btn-play-pause">▶</button>
                    <button class="btn" id="btn-next">⏭</button>
                </div>

                <div class="secondary-controls">
                    <button class="btn" id="btn-mute">🔊</button>
                    <input type="range" class="slider volume-slider" id="volume-slider" value="100" min="0" max="100">
                    <button class="btn-playlist-toggle" id="btn-toggle-playlist">📋 Playlist</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="queue-header">
                <div class="search-container">
                    <input type="text" id="search" class="search-box" placeholder="Search any song...">
                    <button class="btn-search" id="btn-search-trigger">🔍</button>
                </div>
            </div>
            <div class="queue-list" id="queue-list"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://youtube-2bwq.onrender.com";

        // ================= THEME CONFIGURATION =================
        const THEMES = {
            auto: { bg: '#ffd1dc', primary: '#ff477e', textMain: '#2b2b2b', textMuted: '#6b6b6b', surface: 'rgba(255, 255, 255, 0.7)' },
            gym: { bg: '#0d0d0d', primary: '#00ffcc', textMain: '#ffffff', textMuted: '#aaaaaa', surface: 'rgba(20, 20, 20, 0.85)' },
            bhakti: { bg: '#ffebd6', primary: '#ff7e00', textMain: '#4a2511', textMuted: '#795548', surface: 'rgba(255, 255, 255, 0.75)' },
            sad: { bg: '#101820', primary: '#4da8da', textMain: '#e2e2e2', textMuted: '#8a9ea8', surface: 'rgba(30, 40, 50, 0.85)' },
            romantic: { bg: '#ffe4e1', primary: '#ff1493', textMain: '#4a154b', textMuted: '#9c27b0', surface: 'rgba(255, 255, 255, 0.75)' },
            bhojpuri: { bg: '#fffde7', primary: '#d50000', textMain: '#3e2723', textMuted: '#bf360c', surface: 'rgba(255, 255, 255, 0.75)' },
            qawwali: { bg: '#003322', primary: '#ffcc00', textMain: '#ffffff', textMuted: '#a5d6a7', surface: 'rgba(10, 60, 40, 0.85)' },
            funk: { bg: '#1a0033', primary: '#b400ff', textMain: '#ffffff', textMuted: '#ce93d8', surface: 'rgba(40, 10, 60, 0.85)' },
            '90s': { bg: '#fdf3e7', primary: '#d35400', textMain: '#2e4053', textMuted: '#566573', surface: 'rgba(255, 255, 255, 0.75)' },
            old: { bg: '#eaecee', primary: '#5d6d7e', textMain: '#17202a', textMuted: '#5d6d7e', surface: 'rgba(255, 255, 255, 0.75)' },
            english: { bg: '#ebf5fb', primary: '#2980b9', textMain: '#154360', textMuted: '#2471a3', surface: 'rgba(255, 255, 255, 0.75)' },
            podcast: { bg: '#e0f2f1', primary: '#00897b', textMain: '#004d40', textMuted: '#00695c', surface: 'rgba(255, 255, 255, 0.75)' }
        };

        function applyTheme(themeKey) {
            const t = THEMES[themeKey] || THEMES['auto'];
            document.documentElement.style.setProperty('--bg-color', t.bg);
            document.documentElement.style.setProperty('--primary', t.primary);
            document.documentElement.style.setProperty('--text-main', t.textMain);
            document.documentElement.style.setProperty('--text-muted', t.textMuted);
            document.documentElement.style.setProperty('--surface', t.surface);
            
            let hex = t.primary.replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            document.documentElement.style.setProperty('--primary-glow', `rgba(${r}, ${g}, ${b}, 0.4)`);
            document.getElementById('global-loader').style.backgroundColor = t.bg;
        }

        function setActiveChip(btnId) {
            document.querySelectorAll('.chip').forEach(btn => btn.classList.remove('active'));
            if(btnId) {
                const btn = document.getElementById(btnId);
                if(btn) btn.classList.add('active');
            }
        }

        // ================= YOUTUBE IFRAME PLAYER =================
        let player;
        let isPlayerReady = false;
        let progressInterval;
        
        function loadYouTubeAPI() {
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('yt-player-iframe', {
                height: '1', width: '1',
                playerVars: { 'autoplay': 1, 'controls': 0, 'enablejsapi': 1 },
                events: {
                    'onReady': () => { isPlayerReady = true; },
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                DOM.playPause.innerHTML = '⏸';
                startProgressTracking();
                DOM.title.textContent = currentQueue[currentIndex].title; 
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                DOM.playPause.innerHTML = '▶';
                stopProgressTracking();
                if (event.data === YT.PlayerState.ENDED) {
                    if (currentIndex + 1 < currentQueue.length) playTrack(currentIndex + 1);
                }
            }
        }

        loadYouTubeAPI(); 

        // ================= STATE & ELEMENTS =================
        let currentQueue = [];
        let currentIndex = 0;
        let isSeeking = false;

        const DOM = {
            container: document.getElementById('main-container'),
            title: document.getElementById('track-title'),
            artist: document.getElementById('track-artist'),
            artwork: document.getElementById('artwork'),
            playPause: document.getElementById('btn-play-pause'),
            prev: document.getElementById('btn-prev'),
            next: document.getElementById('btn-next'),
            seekSlider: document.getElementById('seek-slider'),
            volumeSlider: document.getElementById('volume-slider'),
            timeCurrent: document.getElementById('time-current'),
            timeTotal: document.getElementById('time-total'),
            queueList: document.getElementById('queue-list'),
            search: document.getElementById('search'),
            btnSearchTrigger: document.getElementById('btn-search-trigger'),
            btnTogglePlaylist: document.getElementById('btn-toggle-playlist'),
            greeting: document.getElementById('greeting-indicator'),
            globalLoader: document.getElementById('global-loader'),
            globalLoaderText: document.getElementById('global-loader-text')
        };

        function showMiniLoader(text = "Loading...") {
            DOM.queueList.innerHTML = `
                <div class="loader-container">
                    <div class="spinner"></div>
                    <div class="loader-text">${text}</div>
                </div>
            `;
        }

        DOM.btnTogglePlaylist.addEventListener('click', () => {
            DOM.container.classList.toggle('show-playlist');
            DOM.btnTogglePlaylist.classList.toggle('active');
        });

        DOM.playPause.addEventListener('click', () => {
            if (!isPlayerReady) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                if (currentQueue.length > 0 && player.getVideoData().video_id) player.playVideo();
                else if (currentQueue.length > 0) playTrack(currentIndex);
            }
        });

        DOM.seekSlider.addEventListener('mousedown', () => isSeeking = true);
        DOM.seekSlider.addEventListener('touchstart', () => isSeeking = true, {passive: true});
        DOM.seekSlider.addEventListener('change', (e) => {
            if (isPlayerReady && player.getDuration) {
                const seekTo = (e.target.value / 100) * player.getDuration();
                player.seekTo(seekTo, true);
            }
            isSeeking = false;
        });

        DOM.volumeSlider.addEventListener('input', (e) => {
            if(isPlayerReady) player.setVolume(e.target.value);
        });

        DOM.next.addEventListener('click', () => { if (currentIndex + 1 < currentQueue.length) playTrack(currentIndex + 1); });
        DOM.prev.addEventListener('click', () => { if (currentIndex - 1 >= 0) playTrack(currentIndex - 1); });

        const triggerSearch = () => {
            const query = DOM.search.value.trim();
            if (query !== '') {
                DOM.greeting.textContent = "Search Results 🔍";
                applyTheme('auto');
                setActiveChip(null);
                searchTracks(query);
            }
        };
        DOM.search.addEventListener('keypress', (e) => { if (e.key === 'Enter') triggerSearch(); });
        DOM.btnSearchTrigger.addEventListener('click', triggerSearch);

        function startProgressTracking() {
            stopProgressTracking();
            progressInterval = setInterval(() => {
                if (!isSeeking && isPlayerReady && player.getCurrentTime) {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration();
                    if (duration > 0) {
                        DOM.seekSlider.value = (current / duration) * 100;
                        DOM.timeCurrent.textContent = formatTime(current);
                        DOM.timeTotal.textContent = formatTime(duration);
                    }
                }
            }, 500);
        }
        function stopProgressTracking() { clearInterval(progressInterval); }
        function formatTime(sec) {
            if (isNaN(sec) || sec === 0) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' + s : s}`;
        }

        // ================= API CALLS & AUTO PLAY =================
        function saveState(type, cat, title, btnId) {
            localStorage.setItem('sukoon_saved_state', JSON.stringify({ type, cat, title, btnId }));
        }

        async function loadFeed(btnId, autoPlay = false) {
            saveState('feed', null, null, btnId);
            setActiveChip(btnId);
            showMiniLoader("Fetching your vibe...");
            try {
                const res = await fetch(`${BACKEND_URL}/api/feed`);
                const data = await res.json();
                DOM.greeting.textContent = data.greeting;
                currentQueue = data.tracks;
                applyTheme('auto');
                renderQueue();
                DOM.globalLoader.classList.add('hidden');
                
                // AUTOMATIC PLAY TRIGGER
                if (autoPlay && currentQueue.length > 0) playTrack(0);
            } catch (err) {
                DOM.queueList.innerHTML = `<div style="padding:20px; text-align:center;">Server is waking up... Please refresh page.</div>`;
            }
        }

        async function loadCategory(cat, title, btnId, autoPlay = false) {
            saveState('category', cat, title, btnId);
            setActiveChip(btnId);
            DOM.greeting.textContent = title;
            applyTheme(cat); 
            showMiniLoader(`Loading ${title}...`);
            try {
                const res = await fetch(`${BACKEND_URL}/api/category?genre=${cat}`);
                const data = await res.json();
                currentQueue = data.tracks;
                renderQueue();
                DOM.globalLoader.classList.add('hidden');
                
                // AUTOMATIC PLAY TRIGGER
                if (autoPlay && currentQueue.length > 0) playTrack(0);
            } catch (err) {
                DOM.queueList.innerHTML = `<div style="padding:20px; text-align:center;">Failed to load.</div>`;
            }
        }

        async function searchTracks(query) {
            showMiniLoader(`Searching for "${query}"...`);
            try {
                const res = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                currentQueue = data.tracks;
                renderQueue();
                
                // AUTOMATIC PLAY AFTER SEARCH
                if (currentQueue.length > 0) playTrack(0);
            } catch (err) {
                DOM.queueList.innerHTML = `<div style="padding:20px; text-align:center;">Search Failed.</div>`;
            }
        }

        function playTrack(index) {
            if (!currentQueue[index]) return;
            currentIndex = index;
            const track = currentQueue[index];

            DOM.title.textContent = "Connecting to Audio... ⏳";
            DOM.artist.textContent = track.artist;
            DOM.artwork.src = track.thumbnail;
            updateQueueHighlight();

            if (isPlayerReady) {
                player.loadVideoById(track.id);
            } else {
                // If clicked before player is fully ready, wait and try again
                setTimeout(() => { if (isPlayerReady) player.loadVideoById(track.id); }, 1000);
            }

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    artwork: [{ src: track.thumbnail, sizes: '512x512', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('play', () => player.playVideo());
                navigator.mediaSession.setActionHandler('pause', () => player.pauseVideo());
                navigator.mediaSession.setActionHandler('nexttrack', () => { if (currentIndex + 1 < currentQueue.length) playTrack(currentIndex + 1); });
                navigator.mediaSession.setActionHandler('previoustrack', () => { if (currentIndex - 1 >= 0) playTrack(currentIndex - 1); });
            }
        }

        function renderQueue() {
            DOM.queueList.innerHTML = '';
            currentQueue.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = `queue-item ${i === currentIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <img class="queue-thumb" src="${t.thumbnail}">
                    <div class="queue-details">
                        <div class="queue-title">${t.title}</div>
                        <div class="queue-artist">${t.artist}</div>
                    </div>
                `;
                item.addEventListener('click', () => playTrack(i));
                DOM.queueList.appendChild(item);
            });
        }

        function updateQueueHighlight() {
            const items = DOM.queueList.querySelectorAll('.queue-item');
            items.forEach((it, idx) => {
                it.classList.toggle('active', idx === currentIndex);
            });
        }

        window.addEventListener('load', () => {
            const saved = JSON.parse(localStorage.getItem('sukoon_saved_state'));
            if (saved && saved.type === 'category') {
                loadCategory(saved.cat, saved.title, saved.btnId, false); // No auto-play on pure refresh to avoid browser block
            } else {
                loadFeed('btn-auto', false);
            }
        });
    </script>
</body>
</html>
